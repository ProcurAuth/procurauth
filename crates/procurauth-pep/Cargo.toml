[package]
name = "procurauth-pep"
description = "Reference PEP library for ProcurAuth: identity token, questions to the PDP, kept answers, ceilings and refusals."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "procurauth_pep"
path = "src/lib.rs"

[features]
default = ["mcp"]
# The helpers for the MCP binding.
mcp = []
# A transport over TLS 1.2 or 1.3 for the link to the PDP, with rustls and aws-lc-rs.
# The feature is off by default: aws-lc-sys needs a C compiler.
tls = ["dep:rustls", "dep:rustls-pki-types"]

[dependencies]
procurauth-core = { path = "../procurauth-core" }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }

[dev-dependencies]
access-token = { path = "../access-token" }
fake-pdp = { path = "../fake-pdp" }
