<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 870" width="420" height="870" role="img" aria-labelledby="t d">
  <title id="t">The ProcurAuth family</title>
  <desc id="d">The specification defines the protocol, the schemas and the conformance cases. The reference tools read them and test the programs. The portal is a backend, an edge and a PDP. It gives identity tokens and AuthZEN decisions to three services, Stowr, Hune and ClickHouse Dash. Each service is a PEP.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a5b4fc"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
  </defs>
  <rect width="420" height="870" rx="20" fill="#12142a"/>
  <g font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
    <text x="24" y="44" font-size="22" font-weight="700" fill="#ffffff">The ProcurAuth family</text>
    <text x="24" y="68" font-size="14" fill="#b4bbe6">Specification, tools and programs.</text>

    <rect x="24" y="90" width="372" height="92" rx="14" fill="#1c1f3d" stroke="#818cf8" stroke-width="2"/>
    <text x="42" y="120" font-size="18" font-weight="700" fill="#ffffff">Specification: procurauth</text>
    <text x="42" y="144" font-size="14" fill="#e0e7ff">Protocol 1.1, MCP binding, 19 JSON</text>
    <text x="42" y="164" font-size="14" fill="#e0e7ff">schemas, 245 conformance cases</text>

    <line x1="210" y1="184" x2="210" y2="212" stroke="#a5b4fc" stroke-width="2" marker-end="url(#a)"/>

    <rect x="24" y="214" width="372" height="112" rx="14" fill="#1c1f3d" stroke="#2c3070" stroke-width="2"/>
    <text x="42" y="244" font-size="18" font-weight="700" fill="#ffffff">Reference tools</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e0e7ff">
      <text x="42" y="268">access-conformance, access-lint,</text>
      <text x="42" y="288">access-token, keycheck, fake-pdp,</text>
      <text x="42" y="308">reference-*, procurauth-pep</text>
    </g>

    <line x1="210" y1="328" x2="210" y2="364" stroke="#34d399" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g)"/>
    <text x="224" y="352" font-size="13" fill="#6ee7b7">test the programs below</text>

    <rect x="24" y="366" width="372" height="484" rx="16" fill="none" stroke="#2c3070" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="42" y="394" font-size="13" font-weight="700" fill="#a5b4fc" letter-spacing="1.2">IMPLEMENTATIONS</text>

    <rect x="42" y="408" width="336" height="132" rx="14" fill="#1c1f3d" stroke="#38bdf8" stroke-width="2"/>
    <text x="60" y="436" font-size="18" font-weight="700" fill="#ffffff">portal</text>
    <text x="120" y="436" font-size="14" fill="#bae6fd">Backend, edge and PDP</text>
    <g font-size="13" fill="#e0e7ff">
      <text x="60" y="466">Backend: users, rights and keys</text>
      <text x="60" y="490">Edge: swaps a key for a token</text>
      <text x="60" y="514">PDP: AuthZEN decisions</text>
    </g>

    <g stroke="#a5b4fc" stroke-width="2" fill="none">
      <line x1="210" y1="542" x2="210" y2="580" marker-end="url(#a)"/>
    </g>
    <text x="224" y="566" font-size="13" fill="#b4bbe6">identity token + AuthZEN</text>

    <g font-size="14" fill="#e0e7ff">
      <rect x="42" y="582" width="336" height="76" rx="14" fill="#1c1f3d" stroke="#818cf8" stroke-width="2"/>
      <text x="60" y="612" font-size="18" font-weight="700" fill="#ffffff">Stowr</text>
      <text x="60" y="638">Browser for S3, cloud storage, folders</text>
      <rect x="326" y="596" width="40" height="22" rx="11" fill="#4338ca"/>
      <text x="346" y="612" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PEP</text>

      <rect x="42" y="672" width="336" height="76" rx="14" fill="#1c1f3d" stroke="#818cf8" stroke-width="2"/>
      <text x="60" y="702" font-size="18" font-weight="700" fill="#ffffff">Hune</text>
      <text x="60" y="728">Dashboards over ClickHouse and more</text>
      <rect x="326" y="686" width="40" height="22" rx="11" fill="#4338ca"/>
      <text x="346" y="702" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PEP</text>

      <rect x="42" y="762" width="336" height="70" rx="14" fill="#1c1f3d" stroke="#818cf8" stroke-width="2"/>
      <text x="60" y="792" font-size="18" font-weight="700" fill="#ffffff">ClickHouse Dash</text>
      <text x="60" y="818">Query console, with MCP</text>
      <rect x="326" y="776" width="40" height="22" rx="11" fill="#4338ca"/>
      <text x="346" y="792" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">PEP</text>
    </g>
  </g>
</svg>
